<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이디노 제주 · 예약 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#3a8a7a;--teal2:#2d6e61;--teal-lt:#e8f5f2;--sand:#f7f4ef;--dark:#2c2c2c;--mid:#666;--orange:#c85a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--sand);color:var(--dark);min-height:100vh;padding-bottom:60px}
.hero{background:var(--teal2);padding:32px 24px 28px;text-align:center}
.hero-title{font-size:22px;font-weight:700;color:#fff;letter-spacing:1px}
.hero-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:6px;letter-spacing:2px}
.card{background:#fff;border-radius:16px;padding:20px 20px;margin:16px 16px 0;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card-title{font-size:12px;font-weight:700;color:var(--teal);letter-spacing:2px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--teal-lt)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mid);margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;font-family:'Noto Sans KR',sans-serif;color:var(--dark);background:#fafafa}
.field input:focus{outline:none;border-color:var(--teal)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 탭 */
.tabs{display:flex;gap:8px;margin:16px 16px 0}
.tab-btn{flex:1;padding:10px 4px;border:1.5px solid #ddd;border-radius:10px;background:#fff;font-size:14px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;color:var(--mid);font-weight:500;transition:all .15s}
.tab-btn.active{background:var(--teal2);color:#fff;border-color:var(--teal2);font-weight:700}
/* PAT */
.pat-wrap{position:relative}
.pat-wrap input{font-family:monospace;font-size:13px;padding-right:44px}
.eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px}
.pat-status{font-size:11px;color:var(--teal);margin-top:4px;min-height:16px}
/* 미리보기 */
.preview{background:var(--teal-lt);border-radius:10px;padding:12px 14px;margin-top:4px}
.prev-row{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid rgba(58,138,122,.15);font-size:13.5px}
.prev-row:last-child{border-bottom:none}
.prev-lbl{color:var(--teal2);font-size:11px;min-width:54px;font-weight:500}
.prev-val{color:var(--dark);font-weight:500}
/* 버튼 */
.btn-save{width:calc(100% - 32px);margin:16px 16px 0;background:var(--teal2);color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;letter-spacing:1px}
.btn-save:disabled{background:#aaa;cursor:not-allowed}
.status{margin:10px 16px 0;border-radius:10px;padding:12px 14px;font-size:14px;display:none;line-height:1.6}
.status.ok{background:#e8f5f2;color:#0f6e56;display:block}
.status.err{background:#fff0ee;color:#a33;display:block}
.status.loading{background:#f5f5f5;color:#666;display:block}
.link-row{display:flex;gap:8px;margin:10px 16px 0}
.link-btn{flex:1;display:block;text-align:center;padding:11px;background:#fff;border:1.5px solid var(--teal);border-radius:10px;color:var(--teal);font-size:13px;font-weight:600;text-decoration:none}
.copy-btn{padding:11px 14px;background:#fff;border:1.5px solid #ddd;border-radius:10px;font-size:13px;cursor:pointer;color:var(--mid)}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-title">♤ 아이디노 제주 ♤</div>
  <div class="hero-sub">예 약 관 리</div>
</div>

<!-- PAT 설정 -->
<div class="card">
  <div class="card-title">GitHub 토큰</div>
  <div class="field">
    <label>Personal Access Token</label>
    <div class="pat-wrap">
      <input type="password" id="pat-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" oninput="savePAT()">
      <button class="eye-btn" onclick="togglePAT()">👁</button>
    </div>
    <div class="pat-status" id="pat-status"></div>
  </div>
</div>

<!-- 팀 탭 -->
<div class="tabs">
  <button class="tab-btn active" id="tab-0" onclick="switchTab(0)">팀 1</button>
  <button class="tab-btn" id="tab-1" onclick="switchTab(1)">팀 2</button>
  <button class="tab-btn" id="tab-2" onclick="switchTab(2)">팀 3</button>
  <button class="tab-btn" id="tab-3" onclick="switchTab(3)">팀 4</button>
</div>

<!-- 예약 정보 -->
<div class="card">
  <div class="card-title">예약 정보</div>
  <div class="field">
    <label>예약자 이름</label>
    <input type="text" id="name" placeholder="홍길동" oninput="updatePreview()">
  </div>
  <div class="row2">
    <div class="field"><label>체크인</label><input type="date" id="checkin" oninput="updatePreview()"></div>
    <div class="field"><label>체크아웃</label><input type="date" id="checkout" oninput="updatePreview()"></div>
  </div>
  <div class="field">
    <label>호실</label>
    <input type="text" id="room" placeholder="크레오 203호" oninput="updatePreview()">
  </div>
  <div class="preview">
    <div class="prev-row"><span class="prev-lbl">예약자</span><span class="prev-val" id="pv-name">—</span></div>
    <div class="prev-row"><span class="prev-lbl">일자</span><span class="prev-val" id="pv-date">—</span></div>
    <div class="prev-row"><span class="prev-lbl">호실</span><span class="prev-val" id="pv-room">—</span></div>
  </div>
</div>

<button class="btn-save" id="submit-btn" onclick="saveReservation()">✓ 수정하기</button>
<div class="status" id="status"></div>
<div class="link-row">
  <a class="link-btn" id="guest-link" href="#" target="_blank">🔗 게스트 페이지</a>
  <button class="copy-btn" onclick="copyLink()">복사</button>
</div>

<script>
const OWNER='partyok-create', REPO='idino-guide';
const FILES=['index.html','guest2.html','guest3.html','guest4.html'];
const LINKS=['https://partyok-create.github.io/idino-guide/','https://partyok-create.github.io/idino-guide/guest2.html','https://partyok-create.github.io/idino-guide/guest3.html','https://partyok-create.github.io/idino-guide/guest4.html'];
let curTab=0;

function switchTab(n){
  curTab=n;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===n));
  document.getElementById('guest-link').href=LINKS[n];
  document.getElementById('guest-link').textContent='🔗 '+FILES[n];
}

function togglePAT(){const i=document.getElementById('pat-input');i.type=i.type==='password'?'text':'password'}

function savePAT(){
  const v=document.getElementById('pat-input').value.trim();
  if(v){try{localStorage.setItem('idino_pat',v);localStorage.setItem('idino_token',v);showPATStatus('✅ 저장됨')}catch(e){}}
}

function loadPAT(){
  const v=localStorage.getItem('idino_pat')||localStorage.getItem('idino_token')||'';
  if(v){document.getElementById('pat-input').value=v;showPATStatus('🔐 불러옴')}
}

function showPATStatus(m){
  const el=document.getElementById('pat-status');
  el.textContent=m;
  setTimeout(()=>el.textContent='',2500);
}

function calcNights(a,b){return(!a||!b)?0:Math.max(0,(new Date(b)-new Date(a))/86400000)}
function fmtD(d){if(!d)return'';const[y,m,day]=d.split('-');return y+'. '+m+'. '+day}

function updatePreview(){
  const name=document.getElementById('name').value;
  const ci=document.getElementById('checkin').value;
  const co=document.getElementById('checkout').value;
  const room=document.getElementById('room').value;
  const n=calcNights(ci,co);
  document.getElementById('pv-name').textContent=name?name+' 님':'—';
  document.getElementById('pv-room').textContent=room||'—';
  document.getElementById('pv-date').textContent=ci&&co&&n>0?fmtD(ci)+' ~ '+fmtD(co)+' ('+n+'박)':ci?fmtD(ci):'—';
}

function buildHTML(){
  const name=document.getElementById('name').value||'—';
  const ci=document.getElementById('checkin').value;
  const co=document.getElementById('checkout').value;
  const room=document.getElementById('room').value||'—';
  const n=calcNights(ci,co);
  const dateStr=ci&&co&&n>0?fmtD(ci)+' ~ '+fmtD(co)+' ('+n+'박)':ci?fmtD(ci):'—';
  const nc=`.notice-box{background:#fff8e6;border:1.5px solid #e8a020;border-radius:12px;padding:16px 18px;margin-bottom:14px}.notice-ttl{font-size:12px;font-weight:700;color:#a06000;letter-spacing:1px;margin-bottom:10px}.notice-row{font-size:13.5px;line-height:1.75;color:var(--dark);padding:5px 0;border-bottom:1px solid rgba(232,160,32,.2)}.notice-row:last-child{border-bottom:none}`;
  const nh=`<div class="notice-box"><div class="notice-ttl">⚠ 꼭 지켜주세요</div><div class="notice-row">🗑 쓰레기·재활용·음식물 → 1층 출입구 좌측 외부 휴지통 / <strong>퇴실 전 처리 필수</strong></div><div class="notice-row">🌙 라운지 이용시간 밤 <strong>10시까지</strong> · 사용 후 전체 소등</div><div class="notice-row">🚪 라운지 폴딩도어 <strong>절대 손대지 마세요</strong> · 출입문만 이용</div></div>`;
  return `<!DOCTYPE html>

.info-card{margin:28px 20px 0;background:#fff;border-radius:16px;padding:6px 24px;box-shadow:0 4px 20px rgba(0,0,0,.07);display:flex;flex-direction:column}
.info-item{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #f0f0f0}

.warning-card strong{color:var(--orange);display:block;margin-bottom:2px;font-size:13px}
.contact-card{background:var(--teal2);border-radius:16px;padding:24px;color:#fff}
.contact-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14.5px}
.contact-row:last-child{margin-bottom:0}
.contact-icon{width:34px;height:34px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.contact-label{font-size:11px;opacity:.7;margin-bottom:2px}.contact-val{font-weight:600}
.footer{text-align:center;padding:36px 20px 48px;font-size:13px;color:var(--mid);line-height:1.8}
.footer-emoji{font-size:22px;display:block;margin-bottom:8px}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.hero{animation:fadeUp .5s ease both}.info-card{animation:fadeUp .5s .1s ease both}.section{animation:fadeUp .5s .2s ease both}
</style></head><body>
<div class="hero"><div class="hero-symbol">♤ &nbsp; ♤</div><div class="hero-title">아이디노 제주</div><div class="hero-sub">이 용 안 내</div></div>
<div class="info-card">

</div>
<div class="section"><div class="section-title">이용 Tip</div>
${nh}
<div class="tip"><div class="tip-num">1</div><div class="tip-body"><div class="tip-main">체크인 오후 3~10시 · 체크아웃 오전 11시</div></div></div>
<div class="tip"><div class="tip-num">2</div><div class="tip-body"><div class="tip-main">도어락 초기 비밀번호 <strong>1234＊</strong> → 입실 후 변경 권장</div><div class="tip-sub">☞ 문을 열고 뒷면 등록 버튼 → 원하는 4자리 입력 → 다시 등록</div></div></div>
<div class="tip"><div class="tip-num">3</div><div class="tip-body"><div class="tip-main">객실·테라스 내 <strong>흡연 금지</strong> (위반 시 즉각 퇴실)</div><div class="tip-sub">☞ 흡연 장소: 1층 야외정원 / 루프탑 지정장소</div></div></div>
<div class="tip"><div class="tip-num">4</div><div class="tip-body"><div class="tip-main">외출 시 에어컨·보일러 반드시 꺼주세요</div></div></div>
<div class="tip"><div class="tip-num">5</div><div class="tip-body"><div class="tip-main">Wi-Fi: 호실 번호 / 비밀번호: TV 좌측 하단 스티커</div></div></div>
<div class="tip"><div class="tip-num">6</div><div class="tip-body"><div class="tip-main">1회용품 사용 자제 부탁드립니다 (세안 도구 제외)</div></div></div>
<div class="tip"><div class="tip-num">7</div><div class="tip-body"><div class="tip-main">부대시설 자유 이용 (오전 10시 ~ 밤 10시)</div><div class="tip-sub">☞ 1층 DINO PLAZA·Biz | 수영장 | 자쿠지 3만원(사전예약) | 도서</div></div></div>

}

async function saveReservation(){
  const pat=document.getElementById('pat-input').value.trim();
  const name=document.getElementById('name').value.trim();
  if(!pat){setStatus('GitHub 토큰을 입력해주세요.','err');return}
  if(!name){setStatus('예약자 이름을 입력해주세요.','err');return}
  const btn=document.getElementById('submit-btn');
  btn.disabled=true;
  setStatus('⏳ 저장 중...','loading');
  try{
    const file=FILES[curTab];
    const apiURL='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+file;
    const hdrs={'Authorization':'Bearer '+pat,'Content-Type':'application/json'};
    const gr=await fetch(apiURL,{headers:hdrs});
    const sha=gr.ok?(await gr.json()).sha:null;
    const html=buildHTML();
    const bytes=new TextEncoder().encode(html);
    let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));
    const body={message:'예약 업데이트: '+name+' ('+file+')',content:btoa(bin)};
    if(sha)body.sha=sha;
    const pr=await fetch(apiURL,{method:'PUT',headers:hdrs,body:JSON.stringify(body)});
    if(!pr.ok)throw new Error('저장 실패: '+pr.status);
    setStatus('✅ 수정 완료! 1~2분 후 반영됩니다.','ok');
    document.getElementById('guest-link').href=LINKS[curTab];
  }catch(e){setStatus('❌ 오류: '+e.message,'err')}
  finally{btn.disabled=false}
}

function setStatus(m,t){const el=document.getElementById('status');el.innerHTML=m;el.className='status '+t}
function copyLink(){navigator.clipboard.writeText(LINKS[curTab]).then(()=>alert('링크 복사됨!'))}

window.addEventListener('load',()=>{loadPAT();switchTab(0)});
</script>
